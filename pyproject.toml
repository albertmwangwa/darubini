[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "darubini"
version = "0.1.0"
description = "Malaria microscopy copilot: segment, count and report parasites in thick blood smears with Meta SAM 3 and Muse Spark."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Albert William Mwangwa" }]
keywords = ["malaria", "microscopy", "segmentation", "sam", "computer-vision", "global-health", "tanzania"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pillow>=10.3",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "bandit[toml]>=1.7.9",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
  "types-PyYAML",
  "types-tqdm",
]
notebooks = ["jupyterlab>=4.2", "matplotlib>=3.8", "pandas>=2.2"]

[project.scripts]
darubini = "darubini.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/darubini"]

# ---------- Ruff: lint + format ----------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "SIM",           # simplify
  "N",             # naming
  "S",             # bandit-style security checks
  "RUF",           # ruff-specific
  "PTH",           # prefer pathlib
  "D",             # docstrings
]
ignore = ["D105", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "S311"]
"scripts/**" = ["D"]

[tool.ruff.format]
quote-style = "double"

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["darubini"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# ---------- Pytest + coverage ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=darubini --cov-report=term-missing --cov-fail-under=80"
markers = ["live: calls the real Meta Model API (skipped unless META_API_KEY is set)"]

[tool.coverage.run]
branch = true
source = ["darubini"]
omit = ["src/darubini/__main__.py"]

# ---------- Bandit ----------
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
