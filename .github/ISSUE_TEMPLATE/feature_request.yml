name: Feature or task
description: Propose a feature or log a build task
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should this make possible, and for whom?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [segmentation, counting, quality, meta-api, report, api, web, data, evaluation, devops, docs]
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we will know this is finished.
