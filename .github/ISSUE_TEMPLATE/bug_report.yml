name: Bug report
description: Something is wrong or broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command or request, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Python version, segmenter (baseline / sam3)"
