name: Dataset links

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["datasets/manifest.yaml"]

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Check every dataset source is reachable
        run: darubini links
