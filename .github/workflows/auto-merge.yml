name: Auto-merge

# Merges a pull request into main once all seven quality checks have finished
# and at least MIN_PASSING of them succeeded.
#
# Runs after CI or CodeQL completes for a pull request. It only acts on
# pull requests that target main, come from a branch in this repository
# (never a fork), are not drafts, and do not carry the "no-automerge" label.

on:
  workflow_run:
    workflows: ["CI", "CodeQL"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  MIN_PASSING: "4"
  # The seven checks that count towards the vote, as GitHub names them.
  CHECKS: |
    Lint and type-check
    Tests (Python 3.10)
    Tests (Python 3.11)
    Tests (Python 3.12)
    Security scans
    Docker build
    analyze

jobs:
  decide:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Count checks and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          pr=$(gh api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:$BRANCH" \
                 --jq '.[0] // empty | {number, base: .base.ref, draft, sha: .head.sha, labels: [.labels[].name]}')
          if [ -z "$pr" ]; then echo "No open pull request for $BRANCH."; exit 0; fi
          number=$(jq -r .number <<<"$pr")
          base=$(jq -r .base <<<"$pr")
          draft=$(jq -r .draft <<<"$pr")
          head=$(jq -r .sha <<<"$pr")
          optout=$(jq -r '.labels | index("no-automerge") != null' <<<"$pr")

          if [ "$base" != "main" ]; then echo "PR #$number targets $base, not main."; exit 0; fi
          if [ "$draft" = "true" ]; then echo "PR #$number is a draft."; exit 0; fi
          if [ "$optout" = "true" ]; then echo "PR #$number has the no-automerge label."; exit 0; fi
          if [ "$head" != "$SHA" ]; then echo "PR #$number has newer commits; waiting for their checks."; exit 0; fi

          runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --jq '.check_runs')
          total=0; done=0; passed=0; summary=""
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            total=$((total + 1))
            state=$(jq -r --arg n "$name" '[.[] | select(.name == $n)] | sort_by(.started_at) | last // empty
                                            | if .status == "completed" then .conclusion else (.status // "missing") end' <<<"$runs")
            [ -z "$state" ] && state="missing"
            case "$state" in queued|in_progress|missing|pending|waiting|requested) ;; *) done=$((done + 1)) ;; esac
            [ "$state" = "success" ] && passed=$((passed + 1))
            summary+="| $name | $state |"$'\n'
          done <<<"$CHECKS"

          {
            echo "### Auto-merge for PR #$number"
            echo "| Check | Result |"; echo "| --- | --- |"; printf '%s' "$summary"
            echo; echo "**$passed of $total passed**, $done of $total finished, need $MIN_PASSING."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PR #$number: $passed/$total passed, $done/$total finished (need $MIN_PASSING)."

          if [ "$done" -lt "$total" ]; then echo "Waiting for the remaining checks."; exit 0; fi
          if [ "$passed" -lt "$MIN_PASSING" ]; then
            echo "Only $passed of $total passed; not merging."
            exit 0
          fi

          state=$(gh api "repos/$REPO/pulls/$number" --jq .state)
          if [ "$state" != "open" ]; then echo "PR #$number is already $state."; exit 0; fi

          gh api -X PUT "repos/$REPO/pulls/$number/merge" \
            -f merge_method=squash -f sha="$SHA" \
            -f commit_title="$(gh api "repos/$REPO/pulls/$number" --jq .title) (#$number)" >/dev/null
          echo "Merged PR #$number ($passed of $total checks passed)."
          gh api -X POST "repos/$REPO/issues/$number/comments" \
            -f body="Auto-merged into main: $passed of $total checks passed (threshold $MIN_PASSING)." >/dev/null
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" >/dev/null 2>&1 || true

          # Merges made with GITHUB_TOKEN do not trigger new workflow runs, so start CI on main explicitly.
          gh workflow run ci.yml --repo "$REPO" --ref main || echo "Could not start CI on main."
